# Параметры анализа ошибок лучшей модели (src/error_analysis.py, notebooks/02_error_analysis.ipynb).
# Анализ идёт ТОЛЬКО на val (strat_fold 9); test не читается.
seed: 42

# Запуск, который анализируется. Ноутбук проверяет, что он действительно лучший по val macro AUROC
# среди запусков с eval_val.json; если нет — падает с ошибкой, а не молча берёт другой.
run: results/2026-11-06_cnn1d_aug
data_config: configs/data.yaml

# Возраст в PTB-XL: значения старше 89 лет анонимизированы и записаны как 300 (проверяется в ноутбуке).
# Границы заданы так, чтобы 300 попадал в последний бин «90+». Бины [a, b).
age:
  bins: [0, 40, 50, 60, 70, 80, 90, 400]
  labels: ["<40", "40–49", "50–59", "60–69", "70–79", "80–89", "90+"]

# Бутстреп по пациентам (у одного пациента может быть несколько записей, см. patient_id).
bootstrap:
  n_boot: 1000
  ci_level: 0.95
  min_valid_share: 0.9   # если в <90% реплик метрика определена, интервал не показываем
min_pos: 20              # меньше стольких положительных (или отрицательных) в группе — AUROC не считаем

# «Уверенная ошибка» (по откалиброванной вероятности, пороги заданы заранее и не подбирались):
confident:
  fp_min_prob: 0.8       # класса нет в метках, а модель даёт p >= 0.8
  fn_max_prob: 0.1       # класс есть в метках, а модель даёт p <= 0.1
  top_k_table: 5         # строк в таблице самых уверенных ошибок на класс и тип
  top_k_plots: 2         # ЭКГ-графиков на класс и тип

plots:
  dpi: 100
  sample_rate: 100       # Гц, версия данных проекта
