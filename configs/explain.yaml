# Параметры карт значимости (src/explain.py): Integrated Gradients для лучшей модели на val (strat_fold 9).
# Test не читается. Модель и пороги берутся из папки запуска `run` (best.pt, val_probs.npy, postprocess.json).
seed: 42

run: results/2026-11-06_cnn1d_aug
data_config: configs/data.yaml

# Integrated Gradients по ЛОГИТУ класса (до sigmoid: у sigmoid градиент затухает при уверенном ответе).
# База сравнения — нулевой сигнал в z-пространстве, то есть «среднее train по каждому отведению».
# Градиенты считаются в fp32 (не в autocast): при fp16 мелкие градиенты уходят в 0, а записей мало.
ig:
  steps: 64                  # шагов правила средних точек (midpoint) по пути baseline -> сигнал
  max_points_per_batch: 1024 # записей × шагов за один проход (на 4 ГБ VRAM с большим запасом)
  max_rel_error_warn: 0.05   # предупреждение, если |sum(attr) - (f(x)-f(baseline))| > 5% от |f(x)-f(baseline)|
repro_max_abs_diff: 0.02     # модель должна воспроизводить val_probs.npy (fp32 против fp16-autocast)

# Примеры: по n записей на класс, СЛУЧАЙНО (seed) среди верно найденных записей, у которых ровно одна метка.
# Намеренно не «самые красивые»: отбор по виду карты исказил бы вывод.
examples:
  per_class: 3

# Окна вокруг R-зубца (по отведению II, neurokit2). Делинеация P/QRS/T на 100 Гц ненадёжна (см. docs/decisions.md),
# поэтому окна грубые и заданы только от R-зубца. Приоритет при пересечении: QRS > ST-T > P/PR.
rpeaks:
  lead: II
  min_beats: 3
  rr_s: [0.3, 2.0]           # медианный RR вне диапазона -> детекция не принимается, запись пропускается в этой части
windows:
  qrs_half_width_s: 0.06     # QRS: R ± 60 мс
  st_t_end_s: 0.40           # ST–T: от конца QRS до R + 400 мс
  p_start_s: 0.25            # P/PR: от R - 250 мс до начала QRS

# Проверка «влияют ли подсвеченные участки на ответ»: стираем (ставим baseline) 5 блоков по 0.2 с из 50 (10% записи)
# с наибольшей |attr|, с наименьшей и 10 случайных наборов; смотрим падение логита класса.
faithfulness:
  block_samples: 20
  delete_blocks: 5
  n_random_draws: 10

# Контроль «просто амплитуда»: карта той же модели со случайными весами и тривиальная карта |x| (z-единицы).
controls:
  random_model_seed: 123

bootstrap:
  n_boot: 1000
  ci_level: 0.95
  min_valid_share: 0.9

plots:
  dpi: 110
  smooth_samples: 5          # только для показа: скользящая сумма знакового IG на фоне отведений (5 отсчётов = 50 мс)
