# Постобработка и оценка предсказаний на VAL (фолд 9): пороги, температурная калибровка, графики.
# Запуск: python -m src.evaluate --run results/2026-11-06_cnn1d_aug
# Test (фолд 10) этот скрипт не читает вообще: на val подбираются параметры, на test их потом только применяют.
seed: 42

probs_eps: 1.0e-7          # клип вероятностей перед logit: p -> [eps, 1-eps] (float32-sigmoid бывает ровно 0/1)

threshold:
  method: f1_max           # порог класса = точка PR-кривой с максимальным F1 на val

temperature:
  mode: global             # global: один T на все классы (1 параметр) | per_class: свой T у каждого класса
  bounds: [0.05, 20.0]     # диапазон поиска T (оптимизация по log T)

ece:
  n_bins: 10               # равноширинные бины по вероятности положительного класса

crossfit:                  # честная оценка F1/ECE: пороги и T подбираются на части val, считаются на остальной
  n_folds: 5               # разбиение по patient_id, чтобы записи одного пациента не попадали в обе части

plots:
  figures_dir: results/figures   # итог: <figures_dir>/<имя_запуска>/*.png
  dpi: 160
  min_bin_count: 5         # на кривой надёжности не рисуем бины, где меньше стольких записей
